common:
  seed: 42
  output_dir: output/landscape

# NanoGPT (Karpathy) — small GPT for tractable Hessian-vector products
model:
  block_size: 64
  vocab_size: null  # set from character vocabulary
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.0
  bias: true

data:
  name: tiny_shakespeare
  # default: paper/subspace_landscape_convergence/data/tinyshakespeare.txt (downloaded if missing)
  text_path: null
  stride: 64
  batch_size: 32

experiment:
  device: cuda
  lr: 3.0e-4
  weight_decay: 0.1
  train_epochs: 20
  betas: [0.9, 0.95]
  # Cap sequences used for Hessian HVP / subspace (full k still used for Delta_1 / Delta_2 losses)
  hessian_max_sequences: 64
  loss_microbatch: 512

  sample_sizes:
    - 100
    - 150
    - 200
    - 300
    - 400
    - 500
    - 700
    - 1000
    - 1500
    - 2000
    - 3000
    - 4000
    - 5000

  delta1_eps: 0.02
  delta1_num_directions: 50

  delta2_sigma: 0.02
  delta2_num_samples: 100

  subspace_dims: [5, 10, 20]
  top_eigenvec_iters: 30
  top_eigenvec_tol: 1.0e-3

  num_seeds: 3
