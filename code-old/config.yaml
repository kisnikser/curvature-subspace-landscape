common:
  seed: 42
  output_dir: code-old/output/landscape

# Base NanoGPT defaults. Named settings in run_matrix override these.
model:
  block_size: 64
  vocab_size: null  # set from character vocabulary
  n_layer: 4
  n_head: 4
  n_embd: 128
  dropout: 0.0
  bias: true

data:
  name: tiny_shakespeare_reference
  corpus_name: tiny_shakespeare
  text_path: null
  corpus_url: null
  stride: 64
  batch_size: 32

experiment:
  device: cuda
  lr: 3.0e-4
  weight_decay: 0.1
  train_epochs: 20
  betas: [0.9, 0.95]
  # Cap sequences used for Hessian HVP / subspace (full k still used for Delta_1 / Delta_2 losses)
  hessian_max_sequences: 64
  validation_sequences: 256
  loss_microbatch: 512
  gradient_microbatch: 128

  sample_sizes:
    - 100
    - 150
    - 200
    - 300
    - 400
    - 500
    - 700
    - 1000
    - 1500
    - 2000
    - 3000
    - 4000
    - 5000

  delta1_eps: 0.02
  delta1_num_directions: 50

  delta2_sigma: 0.02
  delta2_num_samples: 100
  sigma_values: [0.005, 0.01, 0.02, 0.05, 0.1]

  subspace_dims: [5, 10, 20, 50]
  main_subspace_dim: 10
  overlap_dims: [5, 10, 20, 50]
  top_eigenvec_iters: 30
  top_eigenvec_tol: 1.0e-3
  alignment_num_samples: 32

  num_seeds: 3

run_matrix:
  - name: tiny_shakespeare_reference
    primary: true
    description: "Reference proof-of-concept on Tiny Shakespeare with the smallest publishable nanoGPT."
    data:
      name: tiny_shakespeare_reference
      corpus_name: tiny_shakespeare
      text_path: code-old/data/tinyshakespeare.txt
      stride: 64
      batch_size: 32
    model:
      block_size: 64
      n_layer: 4
      n_head: 4
      n_embd: 128
    experiment:
      train_epochs: 20
      hessian_max_sequences: 64
      sample_sizes: [100, 150, 200, 300, 400, 500, 700, 1000, 1500, 2000, 3000, 4000, 5000]
      sigma_values: [0.005, 0.01, 0.02, 0.05, 0.1]
      subspace_dims: [5, 10, 20, 50]
      overlap_dims: [5, 10, 20, 50]

  - name: wikitext2_medium
    primary: false
    description: "Stronger validation setting on char-level WikiText-2 with a wider nanoGPT."
    data:
      name: wikitext2_medium
      corpus_name: wikitext2
      text_path: code-old/data/wikitext2_train.txt
      stride: 128
      batch_size: 24
    model:
      block_size: 128
      n_layer: 6
      n_head: 6
      n_embd: 192
    experiment:
      train_epochs: 12
      hessian_max_sequences: 48
      sample_sizes: [256, 384, 512, 768, 1024, 1536, 2048, 3072, 4096]
      sigma_values: [0.005, 0.01, 0.02, 0.05, 0.1]
      subspace_dims: [5, 10, 20, 50]
      overlap_dims: [5, 10, 20, 50]
