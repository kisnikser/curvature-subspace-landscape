<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" role="img" aria-label="Schematic: loss landscape slice and principal curvature direction">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
  </defs>
  <rect width="700" height="280" fill="url(#bg)" rx="4"/>
  <!-- axes -->
  <line x1="72" y1="210" x2="628" y2="210" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="72" y1="210" x2="72" y2="48" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- landscape curve -->
  <path d="M 90 175 C 180 95 260 85 340 120 S 500 180 610 88" fill="none" stroke="#1e3a5f" stroke-width="2.2" stroke-linecap="round"/>
  <!-- subspace direction -->
  <line x1="340" y1="120" x2="420" y2="75" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
  <polygon points="420,75 408,78 411,86" fill="#c2410c"/>
  <text x="430" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9a3412">top-D Hessian subspace</text>
  <text x="350" y="248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#475569">parameter space (schematic)</text>
</svg>
